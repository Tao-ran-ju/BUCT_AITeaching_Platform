<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="北京化工大学AI教师管理端，一站式教师服务平台">
    <meta name="keywords" content="管理平台,教师,智能体,北京化工大学,BUCT">
    <title>北化AI教师管理端-数据驾驶舱</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/pages/dashboard.css">
</head>
<body>
    <div class="shortcut">
        <div class="wrapper" style="position: relative;">
            <img src="../assets/images/buct.png" alt="">
            <img src="../assets/images/college_of_information_science_and_technology.png" alt="" style="margin:0 25px; max-width: 90%; max-height: 90%; display: block; margin-top: 2.6px;">
            <span style="line-height: 52px; font-family: 'STXingkai', '华文行楷', sans-serif; font-weight:700; font-size: 40px;">教师端在线</span>
            <ul style="margin-left: auto;">
                <li><a href="../index.html">网站主页</a></li>
                <li><a href="./course_resources.html">课程资源</a></li>
                <li><a href="./class_management.html">班级管理</a></li>
                <li><a href="./aigc.html">备课中心</a></li>
                <li><a href="./homework_correction.html">作业批改</a></li>
                <li><a href="./message_queue.html">消息队列</a></li>
                <li><a href="./personal_setting.html">个人设置</a></li>
            </ul>
            <div class="underline" style="position: absolute;bottom:8px;height:2px;background:blue;transition:0.3s; width:65px"></div>
        </div>
    </div>

    <div class="wrapper page-body">
        <div class="page-header">
            <h2>数据驾驶舱</h2>
            <p>教学核心指标与能力矩阵热力图，帮助教师掌握整体学情。</p>
        </div>

        <div class="dash-toolbar">
            <div class="form-row inline">
                <label class="form-label" for="courseFilter">能力矩阵 · 按课程</label>
                <select class="form-select" id="courseFilter">
                    <option value="">全部课程</option>
                </select>
            </div>
        </div>

        <div class="metric-grid" id="metricGrid"></div>

        <section class="panel">
            <div class="panel-head">
                <h3>能力矩阵</h3>
                <span class="panel-sub">知识点平均得分（0–100%）</span>
            </div>
            <div class="panel-body">
                <div class="heatmap" id="heatmap"></div>
                <div class="heat-legend">
                    <span>0%</span>
                    <div class="heat-legend-bar"></div>
                    <span>100%</span>
                </div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-head">
                <h3>任务进度热力图</h3>
                <span class="panel-sub">学生 × 任务 完成情况</span>
            </div>
            <div class="panel-body">
                <div class="task-heat" id="taskHeatmap"></div>
                <div class="task-heat-legend">
                    <span class="tl-item"><i class="tl-dot completed"></i>已完成</span>
                    <span class="tl-item"><i class="tl-dot pending"></i>未完成</span>
                    <span class="tl-item"><i class="tl-dot overdue"></i>已截止未完成</span>
                </div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-head">
                <h3>成绩分布</h3>
                <span class="panel-sub">作业得分区间人数</span>
            </div>
            <div class="panel-body">
                <div class="bar-chart" id="scoreChart"></div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-head">
                <h3>教学效果对比</h3>
                <span class="panel-sub">各课程平均分 · 通过率</span>
            </div>
            <div class="panel-body">
                <div class="bar-chart" id="effectChart"></div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-head">
                <div class="panel-title-group">
                    <h3>学习不积极学生 · 学情预警</h3>
                    <span class="panel-sub" id="warnCount"></span>
                </div>
                <div class="panel-actions">
                    <button class="btn small" id="btnScan">立即扫描</button>
                    <a class="btn small secondary" href="./warning.html">完整预警页 →</a>
                </div>
            </div>
            <div class="panel-body">
                <div class="dash-warning-list" id="dashWarningList"></div>
            </div>
        </section>
    </div>

    <script src="../assets/lib/axios.min.js"></script>
    <script src="../js/pages/api.js"></script>
    <script src="../js/pages/common.js"></script>
    <script src="../js/pages/dashboard.js"></script>
</body>
</html>
