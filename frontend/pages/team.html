<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="北京化工大学AI教师管理端，一站式教师服务平台">
    <meta name="keywords" content="管理平台,教师,智能体,北京化工大学,BUCT">
    <title>北化AI教师管理端-学习小组</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/pages/team.css">
</head>
<body>
    <div class="shortcut">
        <div class="wrapper" style="position: relative;">
            <img src="../assets/images/buct.png" alt="">
            <img src="../assets/images/college_of_information_science_and_technology.png" alt="" style="margin:0 25px; max-width: 90%; max-height: 90%; display: block; margin-top: 2.6px;">
            <span style="line-height: 52px; font-family: 'STXingkai', '华文行楷', sans-serif; font-weight:700; font-size: 40px;">教师端在线</span>
            <ul style="margin-left: auto;">
                <li><a href="../index.html">网站主页</a></li>
                <li><a href="./course_resources.html">课程资源</a></li>
                <li><a href="./class_management.html">班级管理</a></li>
                <li><a href="./aigc.html">备课中心</a></li>
                <li><a href="./homework_correction.html">作业批改</a></li>
                <li><a href="./message_queue.html">消息队列</a></li>
                <li><a href="./personal_setting.html">个人设置</a></li>
            </ul>
            <div class="underline" style="position: absolute;bottom:8px;height:2px;background:blue;transition:0.3s; width:65px"></div>
        </div>
    </div>

    <div class="wrapper page-body">
        <div class="page-header">
            <h2>学习小组管理</h2>
            <p>组建学习小组 / 竞赛队伍，指定组长，管理成员构成。</p>
        </div>

        <div class="team-layout">
            <!-- 左栏：新建小组 -->
            <section class="panel team-left">
                <div class="panel-head"><h3>新建学习小组</h3></div>
                <div class="panel-body">
                    <form id="teamForm">
                        <div class="form-row">
                            <label class="form-label">小组名称</label>
                            <input class="form-input" id="teamName" placeholder="如：DP 攻坚组">
                        </div>
                        <div class="form-row">
                            <label class="form-label">所属课程（选填）</label>
                            <select class="form-select" id="teamCourse">
                                <option value="">（不归属课程）</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label class="form-label">选择班级</label>
                            <select class="form-select" id="teamClass"></select>
                        </div>
                        <div class="form-row">
                            <label class="form-label">组长</label>
                            <select class="form-select" id="teamLeader"></select>
                        </div>
                        <div class="form-row">
                            <label class="form-label">简介（选填）</label>
                            <textarea class="form-textarea" id="teamDesc" placeholder="小组目标、分工说明…"></textarea>
                        </div>
                        <button type="submit" class="btn">创建小组</button>
                    </form>
                </div>
            </section>

            <!-- 右栏：小组列表 -->
            <section class="panel team-right">
                <div class="panel-head"><h3>小组列表 <span class="muted" id="teamHint"></span></h3></div>
                <div class="panel-body">
                    <ul class="team-list" id="teamList"></ul>
                </div>
            </section>
        </div>
    </div>

    <!-- 通用模态框 -->
    <div class="modal-mask" id="modalMask">
        <div class="modal">
            <div class="modal-head">
                <h3 id="modalTitle">标题</h3>
                <span class="modal-close" id="modalClose">&times;</span>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-foot">
                <button class="btn secondary" id="modalCancel">取消</button>
                <button class="btn" id="modalOk">确定</button>
            </div>
        </div>
    </div>

    <script src="../assets/lib/axios.min.js"></script>
    <script src="../js/pages/api.js"></script>
    <script src="../js/pages/common.js"></script>
    <script src="../js/pages/team.js"></script>
</body>
</html>
