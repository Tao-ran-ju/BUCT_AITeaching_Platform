<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="北京化工大学AI教师管理端，一站式教师服务平台">
    <meta name="keywords" content="管理平台,教师,智能体,北京化工大学,BUCT">
    <title>北化AI教师管理端-个人设置</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/pages/personal_setting.css">
    
</head>
<body>
    <div class="shortcut">
        <div class="wrapper" style="position: relative;">
            <img src="../assets/images/buct.png" alt="">
            <img src="../assets/images/college_of_information_science_and_technology.png" alt="" style="margin:0 25px; max-width: 90%; max-height: 90%; display: block; margin-top: 2.6px;">
            <span style="line-height: 52px; font-family: 'STXingkai', '华文行楷', sans-serif; font-weight:700; font-size: 40px;">教师端在线</span>
            <ul style="margin-left: auto;">
                <li><a href="../index.html">网站主页</a></li>
                <li><a href="./course_resources.html">课程资源</a></li>
                <li><a href="./class_management.html">班级管理</a></li>
                <li><a href="./aigc.html">备课中心</a></li>
                <li><a href="./homework_correction.html">作业批改</a></li>
                <li><a href="./message_queue.html">消息队列</a></li>
                <li><a href="./personal_setting.html">个人设置</a></li>
            </ul>
            <div class="underline" style="position: absolute;bottom:8px;height:2px;background:blue;transition:0.3s; width:65px"></div>
        </div>
    </div>    
    <div class="wrapper">
        <!-- 主容器：相对定位，为左右绝对定位子元素提供定位基准 -->
        <div class="profile_container">
            <!-- 左侧：头像展示与上传区 -->
            <div class="profile_left">
                <img class="avatar" id="avatarImg" src="../assets/images/default_avatar.png" alt="用户头像">
                
                <div class="upload_area">
                    <label for="avatarFile" class="upload_btn">上传新头像</label>
                    <input type="file" id="avatarFile" accept="image/*" hidden>
                </div>

                <div class="preview_area">
                    <h4>头像预览</h4>
                    <img id="previewImg" src="../assets/images/default_avatar.png" alt="预览图">
                    <p>上传后可在此预览效果</p>
                </div>
            </div>

            <!-- 右侧：个人信息编辑区 -->
            <div class="profile_right">
                <h3 class="info_title">个人基本信息</h3>
                <form id="infoForm">
                    <ul class="personal_information">
                        <li>
                            <label>工号</label>
                            <input type="text" id="teacherId" value="T2024001" readonly>
                        </li>
                        <li>
                            <label>姓名</label>
                            <input type="text" id="name" value="张老师">
                        </li>
                        <li>
                            <label>所属部门</label>
                            <input type="text" id="department" value="计算机科学与技术学院">
                        </li>
                        <li>
                            <label>邮箱</label>
                            <input type="email" id="email" value="teacher@buct.edu.cn">
                        </li>
                        <li>
                            <label>联系方式</label>
                            <input type="tel" id="phone" value="13800138000">
                        </li>
                        <li>
                            <label>职称</label>
                            <input type="text" id="position" value="副教授">
                        </li>
                        <li class="btn_row">
                            <button type="submit" class="save_btn">保存修改</button>
                            <button type="reset" class="reset_btn">重置</button>
                            <span id="saveTip" class="save_tip"></span>
                        </li>
                    </ul>
                </form>
            </div>
        </div>
    </div>

    <!--导航区域：个人设置（高亮由 common.js 统一处理）-->
    <script src="../assets/lib/axios.min.js"></script>
    <script src="../js/pages/api.js"></script>
    <script src="../js/pages/common.js"></script>
    <script src="../js/pages/personal_setting.js"></script>
</body>
</html>
