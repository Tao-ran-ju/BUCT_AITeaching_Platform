<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="北京化工大学AI教师管理端，一站式教师服务平台">
    <meta name="keywords" content="管理平台,教师,智能体,北京化工大学,BUCT">
    <title>北化AI教师管理端-班级管理</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/pages/class_management.css">
</head>
<body>
    <div class="shortcut">
        <div class="wrapper" style="position: relative;">
            <img src="../assets/images/buct.png" alt="">
            <img src="../assets/images/college_of_information_science_and_technology.png" alt="" style="margin:0 25px; max-width: 90%; max-height: 90%; display: block; margin-top: 2.6px;">
            <span style="line-height: 52px; font-family: 'STXingkai', '华文行楷', sans-serif; font-weight:700; font-size: 40px;">教师端在线</span>
            <ul style="margin-left: auto;">
                <li><a href="../index.html">网站主页</a></li>
                <li><a href="./course_resources.html">课程资源</a></li>
                <li><a href="./class_management.html">班级管理</a></li>
                <li><a href="./aigc.html">备课中心</a></li>
                <li><a href="./homework_correction.html">作业批改</a></li>
                <li><a href="./message_queue.html">消息队列</a></li>
                <li><a href="./personal_setting.html">个人设置</a></li>
            </ul>
            <div class="underline" style="position: absolute;bottom:8px;height:2px;background:blue;transition:0.3s; width:65px"></div>
        </div>
    </div>

    <div class="wrapper page-body">
        <div class="page-header">
            <h2>班级与学生管理</h2>
            <p>建班、维护班级信息，批量导入学生名单，管理班级学生构成。</p>
        </div>

        <div class="cm-layout">
            <!-- 左栏：班级列表 -->
            <section class="panel cm-left">
                <div class="panel-head">
                    <h3>班级列表</h3>
                    <button class="btn small" id="btnNewClass">+ 新建班级</button>
                </div>
                <div class="panel-body">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>班级</th>
                                <th>年级</th>
                                <th>专业</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="classTableBody"></tbody>
                    </table>
                </div>
            </section>

            <!-- 右栏：学生构成 -->
            <section class="panel cm-right">
                <div class="panel-head">
                    <h3>学生构成 <span class="muted" id="studentClassHint"></span></h3>
                    <button class="btn small" id="btnAddStudents">+ 批量添加学生</button>
                </div>
                <div class="panel-body">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>学号</th>
                                <th>姓名</th>
                                <th>专业</th>
                                <th>联系方式</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <!-- 通用模态框 -->
    <div class="modal-mask" id="modalMask">
        <div class="modal">
            <div class="modal-head">
                <h3 id="modalTitle">标题</h3>
                <span class="modal-close" id="modalClose">&times;</span>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-foot">
                <button class="btn secondary" id="modalCancel">取消</button>
                <button class="btn" id="modalOk">确定</button>
            </div>
        </div>
    </div>

    <script src="../assets/lib/axios.min.js"></script>
    <script src="../js/pages/api.js"></script>
    <script src="../js/pages/common.js"></script>
    <script src="../js/pages/class_management.js"></script>
</body>
</html>
