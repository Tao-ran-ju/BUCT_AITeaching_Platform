<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="北京化工大学AI教师管理端，一站式教师服务平台">
    <meta name="keywords" content="管理平台,教师,智能体,北京化工大学,BUCT">
    <title>北化AI教师管理端-作业批改</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="icon" href="logo.ico" type="image/x-icon">
</head>
<body>
    <div class="shortcut">
        <div class="wrapper" style="position: relative;">
            <img src="./images/buct.png" alt="">
            <img src="./images/college_of_information_science_and_technology.png" alt="" style="margin:0 25px; max-width: 90%; max-height: 90%; display: block; margin-top: 2.6px;">
            <span style="line-height: 52px; font-family: 'STXingkai', '华文行楷', sans-serif; font-weight:700; font-size: 40px;">教师端在线</span>
            <ul style="margin-left: auto;">
                <li><a href="./index.html">网站主页</a></li>
                <li><a href="./course_resources.html">课程资源</a></li>
                <li><a href="./class_management.html">班级管理</a></li>
                <li><a href="./aigc.html">备课中心</a></li>
                <li><a href="./homework_correction.html">作业批改</a></li>
                <li><a href="./message_queue.html">消息队列</a></li>
                <li><a href="./personal_setting.html">个人设置</a></li>
            </ul>
            <div class="underline" style="position: absolute;bottom:8px;height:2px;background:blue;transition:0.3s; width:65px"></div>
        </div>
    </div>
    <!--导航区域：作业批改-->
    <script>
        const as=document.querySelectorAll(".shortcut .wrapper ul a");
        const a=document.querySelector(".shortcut .wrapper ul li:nth-child(5) a");
        const underline=document.querySelector(".shortcut .wrapper .underline");
        const wrapper=document.querySelector(".shortcut .wrapper");

        underline.style.left=`${a.getBoundingClientRect().left-wrapper.getBoundingClientRect().left+15}px`

        for(let i=0;i<as.length;i++){
            as[i].addEventListener('mouseenter',function(e){
                this.classList.add('activated');
                const a_rect=as[i].getBoundingClientRect();
                const wrapper_rect=wrapper.getBoundingClientRect();
                underline.style.left=`${a_rect.left-wrapper_rect.left+15}px`;
            })
            as[i].addEventListener('mouseleave',function(e){
                this.classList.remove('activated');
            })
        }
        
    </script>
</body>
</html>
